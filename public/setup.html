<!doctype html>
<html lang="pt-BR" data-i18n-pending>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="setup.pageTitle">Configuração inicial · Glimpse</title>
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#121211">
  <link rel="stylesheet" href="/css/app.css">
  <script type="module" src="/js/setup.js"></script>
</head>
<body>
  <main class="login">
    <form id="setup-form" novalidate>
      <div class="lang-switch" role="group" data-i18n-attr="aria-label:lang.label">
        <button type="button" data-lang-option="pt" lang="pt-BR">Português</button>
        <button type="button" data-lang-option="en" lang="en">English</button>
      </div>
      <h1><img src="/icon.svg" alt=""> <span data-i18n="setup.heading">Bem-vindo ao Glimpse</span></h1>
      <p data-i18n="setup.intro">Este é o primeiro acesso. Crie a senha de administrador.</p>
      <label class="field-label" for="password" data-i18n="setup.newPassword">Nova senha</label>
      <input type="password" id="password" name="password" autocomplete="new-password" minlength="8" required autofocus>
      <label class="field-label" for="confirm" data-i18n="setup.confirm">Confirme a senha</label>
      <input type="password" id="confirm" name="confirm" autocomplete="new-password" minlength="8" required>
      <p class="hint" id="hint" data-i18n="setup.hint">Mínimo de 8 caracteres.</p>
      <button type="submit" class="primary" data-i18n="setup.submit">Salvar senha e entrar</button>
      <div class="error" id="error" role="alert"></div>
    </form>
  </main>
</body>
</html>
