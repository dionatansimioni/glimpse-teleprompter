<!doctype html>
<html lang="pt-BR" data-i18n-pending>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="library.pageTitle">Glimpse Teleprompter</title>
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#121211">
  <link rel="stylesheet" href="/css/app.css">
  <script type="module" src="/js/library.js"></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/"><img src="/icon.svg" alt=""> Glimpse</a>
    <div class="spacer"></div>
    <div id="app-menu"></div>
  </header>

  <main class="container">
    <!-- Lista de roteiros (staging) -->
    <section id="list-view" hidden>
      <div class="toolbar">
        <input type="search" id="search" placeholder="Buscar roteiros…" data-i18n-attr="placeholder:library.search;aria-label:library.search">
        <button id="new-script" class="primary admin-only" data-i18n="library.new">Novo roteiro</button>
        <label class="button admin-only">
          <span data-i18n="library.import">Importar .md</span>
          <input type="file" id="import" accept=".md,.markdown,.txt,text/markdown,text/plain" multiple hidden>
        </label>
      </div>
      <ul id="scripts" class="script-list"></ul>
      <div id="empty" class="empty" hidden></div>
    </section>

    <!-- Editor -->
    <section id="editor-view" hidden>
      <div class="toolbar">
        <a class="button ghost" href="#/" data-i18n="common.back">← Voltar</a>
        <div class="tabs" role="tablist">
          <button role="tab" id="tab-edit" aria-selected="true" data-i18n="editor.tabEdit">Editar</button>
          <button role="tab" id="tab-preview" aria-selected="false" data-i18n="editor.tabPreview">Visualizar</button>
        </div>
        <div class="spacer"></div>
        <span class="status" id="status"></span>
        <a class="button" id="read-link" hidden data-i18n="editor.openReader">Abrir no teleprompter</a>
        <button class="primary" id="save" data-i18n="common.save">Salvar</button>
      </div>
      <input type="text" id="title" class="title-input" placeholder="Título do roteiro" maxlength="200" data-i18n-attr="placeholder:editor.titlePlaceholder;aria-label:editor.titleLabel">
      <textarea id="content" class="editor-area" placeholder="Escreva ou cole o roteiro em Markdown…" data-i18n-attr="placeholder:editor.contentPlaceholder;aria-label:editor.contentLabel"></textarea>
      <article id="preview" class="preview md" hidden></article>
      <p class="hint">
        <span data-i18n="editor.hintMarkdown">Markdown:</span>
        <code data-i18n="editor.hintSection"># Seção</code> <code data-i18n="editor.hintBold">**negrito**</code>
        <code data-i18n="editor.hintItalic">*itálico*</code> <code data-i18n="editor.hintHighlight">==destaque==</code>
        <code data-i18n="editor.hintNote">&gt; nota de direção</code> <code>---</code> <span data-i18n="editor.hintSeparator">separador.</span>
        <span data-i18n="editor.hintShortcut">Atalho:</span> <code>Ctrl+S</code> <span data-i18n="editor.hintSaves">salva.</span>
      </p>
    </section>
  </main>

  <div id="drop-hint" class="drop-hint" hidden data-i18n="library.drop">Solte os arquivos .md para importar</div>
</body>
</html>
