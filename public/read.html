<!doctype html>
<html lang="pt-BR" data-i18n-pending>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title data-i18n="reader.pageTitle">Teleprompter · Glimpse</title>
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#000000">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="stylesheet" href="/css/app.css">
  <link rel="stylesheet" href="/css/settings.css">
  <link rel="stylesheet" href="/css/reader.css">
  <script type="module" src="/js/reader.js"></script>
</head>
<body class="reader">
  <div id="stage" class="stage">
    <div id="scroller" class="scroller">
      <article id="text" class="prompt-text md"></article>
    </div>
    <div id="guide" class="guide" aria-hidden="true"></div>
    <div class="fade" aria-hidden="true"></div>
  </div>

  <div class="progress" aria-hidden="true"><div id="progress-bar"></div></div>
  <div id="countdown" class="countdown" hidden></div>
  <div id="speed-flash" class="speed-flash" aria-live="polite"></div>

  <nav id="hud" class="hud">
    <a class="hud-btn hud-back" href="/" data-i18n-attr="title:reader.backToLibrary;aria-label:reader.backToLibrary">
      <svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>
    </a>
    <span id="script-title" class="hud-title"></span>
    <div class="hud-center">
      <button class="hud-btn" data-action="jumpBack" data-i18n-attr="title:reader.jumpBack;aria-label:reader.jumpBack">
        <svg viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
      </button>
      <button class="hud-btn play" id="btn-play" data-action="togglePlay" data-i18n-attr="title:reader.playPause">
        <svg class="i-play" viewBox="0 0 24 24"><path class="fill" d="M8 5v14l11-7z"/></svg>
        <svg class="i-pause" viewBox="0 0 24 24"><path class="fill" d="M7 5h4v14H7zM13 5h4v14h-4z"/></svg>
      </button>
      <button class="hud-btn" data-action="jumpForward" data-i18n-attr="title:reader.jumpForward;aria-label:reader.jumpForward">
        <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12l7 7 7-7"/></svg>
      </button>
      <div class="speed-ctrl">
        <button class="hud-btn small" data-action="speedDown" data-i18n-attr="title:reader.speedDown;aria-label:reader.speedDown">−</button>
        <span class="speed-val"><small data-i18n="reader.speedShort">vel.</small><b id="speed-val">0</b></span>
        <button class="hud-btn small" data-action="speedUp" data-i18n-attr="title:reader.speedUp;aria-label:reader.speedUp">+</button>
      </div>
    </div>
    <span id="time-left" class="time-left" data-i18n-attr="title:reader.timeLeft"></span>
    <button class="hud-btn hud-fs" data-action="fullscreen" id="btn-fs" data-i18n-attr="title:reader.fullscreen;aria-label:reader.fullscreen">
      <svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
    </button>
    <button class="hud-btn hud-settings" data-action="settings" data-i18n-attr="title:reader.settings;aria-label:reader.settings">
      <svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>
    </button>
  </nav>

  <aside id="panel" class="panel" hidden data-i18n-attr="aria-label:panel.title">
    <header class="panel-head">
      <h2 data-i18n="panel.title">Configurações</h2>
      <span class="save-status" id="save-status" aria-live="polite"></span>
      <button class="ghost" id="panel-close" data-i18n-attr="aria-label:common.close">✕</button>
    </header>

    <div class="panel-body settings-sections">
      <section class="scope-section">
        <div class="scope" id="scope-group" role="radiogroup" data-i18n-attr="aria-label:panel.scopeLabel">
          <button type="button" role="radio" data-scope="global" aria-checked="true" data-i18n="panel.scopeGlobal">Todos os roteiros</button>
          <button type="button" role="radio" data-scope="script" aria-checked="false" data-i18n="panel.scopeScript">Só este roteiro</button>
        </div>
        <p class="note" id="scope-note"></p>
        <button type="button" id="clear-overrides" hidden data-i18n="panel.clearOverrides">Remover ajustes deste roteiro</button>
      </section>

      <div id="settings-form"></div>

      <section>
        <h3 data-i18n="shortcuts.title">Atalhos e controles</h3>
        <p class="note">
          <span data-i18n="shortcuts.notePre">Clique em</span> <b>+</b>
          <span data-i18n="shortcuts.notePost">e pressione uma tecla do teclado, do controle Bluetooth ou um botão de gamepad.</span>
        </p>
        <div id="bindings" class="bindings"></div>
        <button id="reset-keys" data-i18n="shortcuts.reset">Restaurar atalhos padrão</button>
      </section>

      <section>
        <button id="reset-settings" class="danger" data-i18n="panel.resetGlobal">Restaurar configuração geral padrão</button>
      </section>
    </div>
  </aside>
</body>
</html>
